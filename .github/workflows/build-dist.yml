name: Build installable archive

on:
  push:
    branches:
      - main
      - dev/article-link-audit
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hub-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate PHP syntax
        shell: bash
        run: |
          find . -type f \( -name '*.php' -o -name '*.inc' \) \
            -not -path './.git/*' \
            -not -path './dist/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Run Hub contract tests
        shell: bash
        run: php tests/audit_contract.php

      - name: Build Geeklog plugin archive
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="$(php -r 'include "config.php"; echo $_HUB_PLUGIN["pi_version"];')"
          if [ -z "$version" ]; then
            echo "Unable to determine Hub plugin version from config.php" >&2
            exit 1
          fi

          archive="hub-${version}.zip"

          rm -rf build-package
          mkdir -p build-package/hub dist
          rm -f dist/hub-*.zip

          rsync -a ./ build-package/hub/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build-package/' \
            --exclude 'dist/' \
            --exclude 'tests/'

          (
            cd build-package
            zip -qr "../dist/${archive}" hub
          )

          unzip -t "dist/${archive}"

          unzip -l "dist/${archive}" | grep -q ' hub/config.php$'
          unzip -l "dist/${archive}" | grep -q ' hub/autoinstall.php$'
          unzip -l "dist/${archive}" | grep -q ' hub/functions.inc

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "Built dist/${archive}"

      - name: Upload installable archive
        uses: actions/upload-artifact@v4
        with:
          name: hub-installable
          path: dist/${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

      - name: Commit archive to dist
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A dist/

          if git diff --cached --quiet; then
            echo "dist is already up to date."
            exit 0
          fi

          git commit -m "build: refresh installable Hub archive"

          # Do not let a stale build overwrite a branch that advanced while
          # this job was running. A newer push already has its own build.
          git fetch origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse "origin/${GITHUB_REF_NAME}")" ]; then
            echo "Branch advanced during build; skip dist push and let the newer run publish it."
            exit 0
          fi

          git push origin "HEAD:${GITHUB_REF_NAME}"

          unzip -l "dist/${archive}" | grep -q ' hub/plugin.json

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "Built dist/${archive}"

      - name: Upload installable archive
        uses: actions/upload-artifact@v4
        with:
          name: hub-installable
          path: dist/${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

