name: Build installable archive

on:
  push:
    branches:
      - main
      - dev/article-link-audit
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hub-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php:
          - '5.6'
          - '8.1'
          - '8.3'

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Validate PHP syntax
        shell: bash
        run: |
          php -v
          find . -type f \( -name '*.php' -o -name '*.inc' \) \
            -not -path './.git/*' \
            -not -path './dist/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Run Hub contract tests
        shell: bash
        run: |
          php tests/audit_contract.php
          php tests/upgrade_contract.php
          php tests/relations_contract.php
          php tests/lifecycle_contract.php
          php tests/graph_contract.php
          php tests/editorial_contract.php
          php tests/integrity_contract.php
          php tests/site_context_contract.php
          php tests/suggestion_decisions_contract.php
          php tests/services_contract.php
          php tests/render_contract.php
          php tests/indexnow_contract.php

  build:
    name: Package Hub
    needs:
      - compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up packaging PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none

      - name: Build Geeklog plugin archive
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="$(php -r 'include "config.php"; echo $_HUB_PLUGIN["pi_version"];')"
          if [ -z "$version" ]; then
            echo "Unable to determine Hub plugin version from config.php" >&2
            exit 1
          fi

          archive="hub-${version}.zip"

          rm -rf build-package
          mkdir -p build-package/hub dist
          rm -f "dist/${archive}"

          rsync -a ./ build-package/hub/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build-package/' \
            --exclude 'dist/' \
            --exclude 'tests/'

          (
            cd build-package
            zip -qr "../dist/${archive}" hub
          )

          unzip -t "dist/${archive}"

          archive_files="$(unzip -Z1 "dist/${archive}")"
          for required_file in \
            hub/config.php \
            hub/autoinstall.php \
            hub/functions.inc \
            hub/plugin.json \
            hub/lib-capability-evidence.php \
            hub/lib-content-contract.php \
            hub/lib-metadata.php \
            hub/lib-render.php \
            hub/lib-relations.php \
            hub/lib-graph.php \
            hub/lib-editorial.php \
            hub/lib-integrity.php \
            hub/lib-site-context.php \
            hub/lib-suggestion-decisions.php \
            hub/lib-indexnow.php \
            hub/lib-lifecycle.php \
            hub/services.inc.php \
            hub/install_updates.php \
            hub/admin/relations.php \
            hub/admin/integrity.php \
            hub/sql/mysql_install.php \
            hub/public_html/hub.css \
            hub/docs/plugin-author-guide.md \
            hub/docs/services.md \
            hub/docs/compatibility.md \
            hub/docs/upgrade.md
          do
            printf '%s\n' "$archive_files" | grep -Fxq "$required_file" || {
              echo "Missing from archive: $required_file" >&2
              exit 1
            }
          done

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "Built dist/${archive}"

      - name: Upload installable archive
        uses: actions/upload-artifact@v4
        with:
          name: hub-installable
          path: dist/${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

      - name: Commit archive to dist
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A dist/

          if git diff --cached --quiet; then
            echo "dist is already up to date."
            exit 0
          fi

          source_sha="$(git rev-parse HEAD)"
          git fetch origin "${GITHUB_REF_NAME}"

          if [ "$source_sha" != "$(git rev-parse "origin/${GITHUB_REF_NAME}")" ]; then
            echo "Branch advanced during build; skip dist push and let the newer run publish it."
            exit 0
          fi

          git commit -m "build: refresh installable Hub archive"
          git push origin "HEAD:${GITHUB_REF_NAME}"
